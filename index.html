<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Purple Cat Fight</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div id="hud">
    <div class="panel">Очки: <span id="score">0</span></div>
	
	<!--
    <div class="panel">
      <button id="adminScoreBtn" type="button">ОЧКИ</button>
    </div>
	-->
	
    <div class="panel">
      HPC: <span id="hpText">100/100</span>
      <div id="hpBar"><div id="hpFill"></div></div>
    </div>

    <div class="panel" id="bossHud" style="display:none;">
      Босс: <span id="bossText">0/0</span>
      <div id="bossBar"><div id="bossFill"></div></div>
    </div>

    <div class="panel">
      <span style="opacity:.75; font-weight:700;">Музыка</span>
      <input id="musicVol" type="range" min="0" max="1" step="0.01" value="0.25">
      <button id="musicBtn" type="button"></button>
    </div>
  </div>

  <div id="game">
    <div id="catWrap" class="entity">
      <div id="cat">
        <img src="cat.png" alt="" draggable="false">
      </div>
      <div id="shieldOrbit">
        <div id="shieldArm"><div id="shield"></div></div>
      </div>
    </div>
  </div>

  <div id="hint">100 🐲 / 200 🐍 / 300 🐞 / 400 🦇 / 520 ?</div>

  <div id="winOverlay">
    <div id="winCard">
      <div id="winTitle">Вы выиграли!</div>
      <div id="winText">Скидка 10 % на следующий заказ по промокоду <b>Purple_cat</b></div>
      <button id="restartBtn" type="button">Начать заново</button>
    </div>
  </div>

  <div id="loseOverlay">
    <div id="loseCard">
      <div id="loseTitle">Вы проиграли!</div>
      <button id="loseRestartBtn" type="button">Начать заново</button>
    </div>
  </div>

  <audio id="bgm" src="music.mp3" loop preload="auto"></audio>

  <script src="game.js"></script>
</body>
</html>
