<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Purple Cat vs Skeletons</title>
  <style>
    :root { --bg: #0b0f18; --fg: #e9eefc; --accent: #7c5cff; --danger:#ff4d6d; --ok:#55f2a6; }
    html, body { height: 100%; margin: 0; }
    body{
      background: radial-gradient(1200px 700px at 50% 20%, #1a2340 0%, var(--bg) 55%, #05070c 100%);
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--fg);
      user-select: none;
      touch-action: none;
    }

    #hud{
      position: fixed;
      top: 12px; left: 12px; right: 12px;
      display: flex;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
      gap: 10px;
      flex-wrap: wrap;
    }
    .panel{
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      padding: 10px 14px;
      backdrop-filter: blur(6px);
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }
    .panel span{ color:#fff; text-shadow: 0 0 18px rgba(124,92,255,.55); }

    #musicVol{
      pointer-events: auto;
      width: 170px;
      accent-color: var(--accent);
    }
    #musicBtn{
      pointer-events: auto;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(124,92,255,.18);
      color: var(--fg);
      border-radius: 10px;
      padding: 6px 10px;
      font-weight: 700;
      cursor: pointer;
    }

    #hpBar{
      width: 180px;
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.14);
      overflow: hidden;
    }
    #hpFill{
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--ok), #b6ffea);
      transform-origin: left center;
    }
    #hpText{ opacity:.9; font-weight:800; }

    #game{ position: fixed; inset: 0; }

    .entity{
      position:absolute;
      transform: translate(-50%,-50%);
      will-change: left, top, transform;
    }

    #catWrap{
      width: 130px;
      height: 130px;
      border-radius: 16px;
      touch-action: none;
      cursor: grab;
    }
    #catWrap:active{ cursor: grabbing; }

    #cat{
      width: 130px;
      height: 130px;
      border-radius: 16px;
      overflow:hidden;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      box-shadow: 0 18px 40px rgba(0,0,0,.45);
    }
    #cat img{
      width:100%; height:100%;
      object-fit: cover;
      display:block;
      user-select:none;
      -webkit-user-drag:none;
      pointer-events:none;
    }

    /* Щит: центр в центре кота, "капсула" ходит по кругу */
    #shieldOrbit{
      position:absolute;
      left:50%; top:50%;
      width:0; height:0;
      transform: translate(-50%,-50%);
      pointer-events:none;
    }
    #shieldArm{
      position:absolute;
      left:0; top:0;
      width:0; height:0;
      transform-origin: 0 0;
      will-change: transform;
    }
    #shield{
      position:absolute;
      left: 86px;  /* радиус орбиты */
      top: 0px;
      width: 180px;
      height: 22px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 50%, rgba(255,255,255,.9), rgba(124,92,255,.65));
      border: 1px solid rgba(255,255,255,.25);
      box-shadow: 0 0 18px rgba(124,92,255,.55), 0 0 40px rgba(124,92,255,.25);
      transform: translate(-50%,-50%);
    }

    .skeleton{
      width: 82px;
      height: 82px;
      border-radius: 14px;
      display:grid;
      place-items:center;
      font-size:46px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 14px 28px rgba(0,0,0,.35);
    }
    .hit{ animation: pop .14s ease-out forwards; }
    @keyframes pop { to { transform: translate(-50%,-50%) scale(1.25); opacity: 0; } }

    #hint{
      position: fixed;
      bottom: 10px; left: 0; right: 0;
      text-align: center;
      opacity: .7;
      font-size: 12px;
      pointer-events: none;
      z-index: 10;
    }

    #winOverlay{
      position: fixed;
      inset: 0;
      display:none;
      align-items:center;
      justify-content:center;
      background: rgba(0,0,0,.55);
      z-index: 50;
      text-align:center;
      padding: 20px;
    }
    #winCard{
      max-width: 720px;
      background: rgba(10,14,24,.85);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 16px;
      padding: 18px 18px;
      box-shadow: 0 18px 60px rgba(0,0,0,.55);
      backdrop-filter: blur(8px);
    }
    #winTitle{ font-size: 26px; font-weight: 800; margin-bottom: 10px; }
    #winText{ font-size: 16px; line-height: 1.4; }
    #restartBtn{
      margin-top: 14px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(124,92,255,.25);
      color: var(--fg);
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="panel">
      Очки: <span id="score">0</span>
    </div>

    <div class="panel">
      HP: <span id="hpText">100/100</span>
      <div id="hpBar"><div id="hpFill"></div></div>
    </div>

    <div class="panel">
      <span style="opacity:.75; font-weight:700;">Музыка</span>
      <input id="musicVol" type="range" min="0" max="1" step="0.01" value="0.25">
      <button id="musicBtn" type="button">Выкл</button>
    </div>
  </div>

  <div id="game">
    <div id="catWrap" class="entity">
      <div id="cat">
        <img src="cat.png" alt="Кот" draggable="false">
      </div>

      <div id="shieldOrbit">
        <div id="shieldArm">
          <div id="shield" aria-label="Щит"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="hint">Зажми ЛКМ (или палец) на коте и веди. Щит убивает при касании.</div>

  <div id="winOverlay">
    <div id="winCard">
      <div id="winTitle">Вы выиграли!</div>
      <div id="winText">Скидка 10 % на следующий заказ по промокоду <b>Purple_cat</b></div>
      <button id="restartBtn" type="button">Начать заново</button>
    </div>
  </div>

  <audio id="bgm" src="music.mp3" loop preload="auto"></audio>

<script>
(() => {
  const game = document.getElementById('game');
  const catWrap = document.getElementById('catWrap');
  const shieldArm = document.getElementById('shieldArm');

  const scoreEl = document.getElementById('score');
  const hpText = document.getElementById('hpText');
  const hpFill = document.getElementById('hpFill');

  const bgm = document.getElementById('bgm');
  const musicVol = document.getElementById('musicVol');
  const musicBtn = document.getElementById('musicBtn');

  const winOverlay = document.getElementById('winOverlay');
  const restartBtn = document.getElementById('restartBtn');

  // --- Настройки
  const CFG = {
    spawnEveryMs: 700,
    skeletonSpeed: 120,
    maxSkeletons: 14,

    catSize: 130,
    skeletonRadius: 38, // примерно половина от 82
    catRadius: 38,      // "круг" кота для урона
    shieldRadius: 86,   // радиус орбиты щита (px)
    shieldHitRadius: 80,// радиус щита для убийства (подбери)
    shieldDegPerSec: 220,

    maxHP: 100,
    contactCooldownMs: 220, // чтобы один скелет не снимал 60 HP/сек
    winScore: 1000
  };

  // --- Состояние
  let score = 0;
  let hp = CFG.maxHP;
  let gameOver = false;

  let spawnTimer = null;
  const skeletons = new Set();

  let catPos = { x: window.innerWidth/2, y: window.innerHeight/2 };

  // drag
  let dragging = false;
  let activePointerId = null;
  let dragOffset = { x: 0, y: 0 };

  // shield
  let shieldAngle = 0; // radians
  let shieldPos = { x: catPos.x + CFG.shieldRadius, y: catPos.y };

  // музыка
  let musicEnabled = true;

  // --- SFX (удар меча)
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  const sfxCtx = new AudioCtx();
  let sfxUnlocked = false;

  function unlockSfx() {
    if (sfxUnlocked) return;
    sfxCtx.resume().then(() => sfxUnlocked = true).catch(()=>{});
  }

  function swordHitSound() {
    if (!sfxUnlocked) return;
    const now = sfxCtx.currentTime;

    const gain = sfxCtx.createGain();
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.35, now + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);

    const bufferSize = Math.floor(sfxCtx.sampleRate * 0.12);
    const buffer = sfxCtx.createBuffer(1, bufferSize, sfxCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);

    const noise = sfxCtx.createBufferSource();
    noise.buffer = buffer;

    const band = sfxCtx.createBiquadFilter();
    band.type = 'bandpass';
    band.frequency.setValueAtTime(2200, now);
    band.Q.setValueAtTime(3.5, now);

    const osc = sfxCtx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(780, now);
    osc.frequency.exponentialRampToValueAtTime(420, now + 0.09);

    noise.connect(band).connect(gain).connect(sfxCtx.destination);
    osc.connect(gain).connect(sfxCtx.destination);

    noise.start(now);
    osc.start(now);
    noise.stop(now + 0.13);
    osc.stop(now + 0.13);
  }

  // --- Утилиты
  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

  function circlesHit(a, ar, b, br) {
    // столкновение кругов: dist < ar+br [web:77]
    return dist(a, b) < (ar + br);
  }

  function setCatPos(x, y) {
    const pad = CFG.catSize / 2;
    catPos.x = clamp(x, pad, window.innerWidth - pad);
    catPos.y = clamp(y, pad, window.innerHeight - pad);
    catWrap.style.left = catPos.x + 'px';
    catWrap.style.top  = catPos.y + 'px';
  }

  function updateHPUI() {
    hpText.textContent = `${hp}/${CFG.maxHP}`;
    const k = hp / CFG.maxHP;
    hpFill.style.width = (k * 100) + '%';
    if (k < 0.35) hpFill.style.background = `linear-gradient(90deg, var(--danger), #ff9fb0)`;
    else hpFill.style.background = `linear-gradient(90deg, var(--ok), #b6ffea)`;
  }

  // --- Музыка
  bgm.volume = Number(musicVol.value);
  musicVol.addEventListener('input', () => bgm.volume = Number(musicVol.value));

  function syncMusicButton() {
    musicBtn.textContent = musicEnabled ? 'Выкл' : 'Вкл';
  }

  async function applyMusicState() {
    if (!musicEnabled) { bgm.pause(); return; }
    try { await bgm.play(); } catch (e) {}
  }

  musicBtn.addEventListener('click', async () => {
    musicEnabled = !musicEnabled;
    syncMusicButton();
    await applyMusicState();
  });

  // старт музыки "по умолчанию" при первом жесте пользователя (браузеры блокируют autoplay со звуком) [web:20]
  window.addEventListener('pointerdown', async () => { await applyMusicState(); }, { once: true });
  syncMusicButton();

  // --- Скелеты
  function spawnSkeleton() {
    if (gameOver) return;
    if (skeletons.size >= CFG.maxSkeletons) return;

    const el = document.createElement('div');
    el.className = 'entity skeleton';
    el.textContent = '💀';
    game.appendChild(el);

    const side = Math.floor(Math.random() * 4);
    const margin = 40;

    let x, y;
    if (side === 0) { x = Math.random()*window.innerWidth; y = -margin; }
    if (side === 1) { x = window.innerWidth + margin; y = Math.random()*window.innerHeight; }
    if (side === 2) { x = Math.random()*window.innerWidth; y = window.innerHeight + margin; }
    if (side === 3) { x = -margin; y = Math.random()*window.innerHeight; }

    const sk = {
      el,
      pos: { x, y },
      dead: false,
      lastDamageAt: 0
    };

    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    skeletons.add(sk);
  }

  function showWin() {
    gameOver = true;
    winOverlay.style.display = 'flex';
    if (spawnTimer) clearInterval(spawnTimer);
  }

  function killSkeleton(sk) {
    if (sk.dead) return;
    sk.dead = true;

    sk.el.classList.add('hit');
    swordHitSound();

    score += 1;
    scoreEl.textContent = score;

    setTimeout(() => {
      sk.el.remove();
      skeletons.delete(sk);
    }, 160);

    if (score >= CFG.winScore && !gameOver) showWin();
  }

  function damageCat(sk, nowMs) {
    if (nowMs - sk.lastDamageAt < CFG.contactCooldownMs) return;
    sk.lastDamageAt = nowMs;

    hp = Math.max(0, hp - 1);
    updateHPUI();

    if (hp <= 0) {
      // автоперезапуск игры и сброс очков
      resetGame();
    }
  }

  // --- Перетаскивание кота
  catWrap.addEventListener('dragstart', (e) => e.preventDefault());

  function pointerDown(e) {
    if (gameOver) return;

    unlockSfx();
    if (e.pointerType === 'mouse' && e.button !== 0) return;

    dragging = true;
    activePointerId = e.pointerId;

    const rect = catWrap.getBoundingClientRect();
    dragOffset.x = e.clientX - (rect.left + rect.width/2);
    dragOffset.y = e.clientY - (rect.top  + rect.height/2);

    catWrap.setPointerCapture(e.pointerId);
    e.preventDefault();
  }

  function pointerMove(e) {
    if (!dragging || gameOver) return;
    if (e.pointerId !== activePointerId) return;

    if (e.pointerType === 'mouse' && (e.buttons & 1) === 0) {
      dragging = false;
      activePointerId = null;
      return;
    }

    setCatPos(e.clientX - dragOffset.x, e.clientY - dragOffset.y);
  }

  function pointerUp(e) {
    if (e.pointerId !== activePointerId) return;
    dragging = false;
    activePointerId = null;
    try { catWrap.releasePointerCapture(e.pointerId); } catch (_) {}
  }

  catWrap.addEventListener('pointerdown', pointerDown);
  window.addEventListener('pointermove', pointerMove);
  window.addEventListener('pointerup', pointerUp);
  window.addEventListener('pointercancel', pointerUp);

  // --- Игровой цикл
  let lastT = performance.now();
  function tick(t) {
    const dt = (t - lastT) / 1000;
    lastT = t;

    // вращение щита (CSS transform rotate) [web:89]
    shieldAngle += (CFG.shieldDegPerSec * Math.PI / 180) * dt;
    shieldArm.style.transform = `rotate(${shieldAngle}rad)`;

    // вычисляем реальную позицию щита для коллизий
    shieldPos.x = catPos.x + Math.cos(shieldAngle) * CFG.shieldRadius;
    shieldPos.y = catPos.y + Math.sin(shieldAngle) * CFG.shieldRadius;

    if (!gameOver) {
      const nowMs = performance.now();

      for (const sk of skeletons) {
        if (sk.dead) continue;

        const dirX = catPos.x - sk.pos.x;
        const dirY = catPos.y - sk.pos.y;
        const len = Math.hypot(dirX, dirY) || 1;

        sk.pos.x += (dirX / len) * CFG.skeletonSpeed * dt;
        sk.pos.y += (dirY / len) * CFG.skeletonSpeed * dt;

        sk.el.style.left = sk.pos.x + 'px';
        sk.el.style.top  = sk.pos.y + 'px';

        // 1) если коснулся щита — умирает
        if (circlesHit(sk.pos, CFG.skeletonRadius, shieldPos, CFG.shieldHitRadius)) {
          killSkeleton(sk);
          continue;
        }

        // 2) если коснулся кота напрямую — снимаем HP
        if (circlesHit(sk.pos, CFG.skeletonRadius, catPos, CFG.catRadius)) {
          damageCat(sk, nowMs);
        }
      }
    }

    requestAnimationFrame(tick);
  }

  // --- Рестарт/сброс
  function clearSkeletons() {
    for (const sk of skeletons) sk.el.remove();
    skeletons.clear();
  }

  function resetGame() {
    // скрыть победу, если была
    winOverlay.style.display = 'none';
    gameOver = false;

    clearSkeletons();

    score = 0;
    scoreEl.textContent = score;

    hp = CFG.maxHP;
    updateHPUI();

    setCatPos(window.innerWidth/2, window.innerHeight/2);

    if (spawnTimer) clearInterval(spawnTimer);
    spawnTimer = setInterval(spawnSkeleton, CFG.spawnEveryMs);
  }

  restartBtn.addEventListener('click', () => {
    resetGame();
  });

  window.addEventListener('resize', () => setCatPos(catPos.x, catPos.y));

  // --- Старт
  setCatPos(window.innerWidth/2, window.innerHeight/2);
  updateHPUI();
  spawnTimer = setInterval(spawnSkeleton, CFG.spawnEveryMs);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
